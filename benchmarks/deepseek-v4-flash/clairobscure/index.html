<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clair Obscur: Expedition 33 — Battle Stage</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a1014; overflow: hidden; }
  body { font-family: "Georgia", serif; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; }
  #game { width: 100%; height: 100%; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #error-banner {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(120, 30, 30, 0.92); color: #ffe0d0; padding: 12px 26px;
    border: 1px solid #ff8a7a; border-radius: 8px; font: 600 16px Georgia, serif;
    display: none; z-index: 60; text-align: center; max-width: 70vw;
  }
  #loader {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #e9dcc3; font: 600 18px Georgia, serif; letter-spacing: 0.2em;
    background: radial-gradient(circle at 50% 40%, #12222b, #0a1014 70%);
    z-index: 50;
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <canvas id="overlay" style="position:absolute; inset:0; pointer-events:none;"></canvas>
    <div id="error-banner"></div>
    <div id="loader">Entering the Vault…</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
