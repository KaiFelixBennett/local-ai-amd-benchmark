<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moorland Mayhem – Featherstorm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1a0d;
      font-family: '"Baloo 2", "Segoe UI", Arial, sans-serif';
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-container canvas {
      display: block;
    }

    /* Loading overlay */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #0d1a0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-overlay h1 {
      font-size: 48px;
      color: #8fbc8f;
      font-weight: 800;
      margin-bottom: 16px;
      text-align: center;
    }

    #loading-overlay p {
      font-size: 18px;
      color: #a0a0a0;
      margin-bottom: 32px;
    }

    .loading-bar {
      width: 300px;
      height: 8px;
      background: #1a2a1a;
      border-radius: 4px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: #8fbc8f;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <h1>Moorland Mayhem</h1>
    <p>Featherstorm</p>
    <div class="loading-bar">
      <div class="loading-bar-fill" id="loading-fill"></div>
    </div>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
