<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clair Obscure — Expedition 33 (Reactive Combat Study)</title>
<style>
  :root {
    --gold: #c9a24b;
    --gold-bright: #e8c979;
    --teal: #7fd8cf;
    --oxblood: #7c2d3a;
    --bone: #e9e2cf;
    --ink: #0c0f14;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--ink);
    color: var(--bone);
    font-family: Georgia, 'Times New Roman', serif;
  }

  /* --- Layer stack (bottom -> top): scene, fx, hud, ui --- */
  #scene, #fx, #hud, #ui {
    position: fixed;
    inset: 0;
  }
  #scene canvas { display: block; }
  #fx, #hud { pointer-events: none; }
  #ui { pointer-events: none; z-index: 10; }
  #ui > * { pointer-events: auto; }

  /* =========================================================
     Battle menu (art-nouveau gilded panels)
  ========================================================= */
  .cm-root {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: center;
    padding: 0 16px 14px;
  }
  #ui > .cm-root {
    pointer-events: none; /* only the panel itself captures the mouse */
  }
  .cm-panel {
    pointer-events: auto;
    width: min(680px, 96vw);
    background: linear-gradient(180deg, rgba(16,20,28,0.97), rgba(10,13,19,0.97));
    border: 1px solid rgba(201,162,75,0.55);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.6),
      0 0 42px rgba(201,162,75,0.10),
      inset 0 0 60px rgba(0,0,0,0.5);
    padding: 14px 18px 10px;
    animation: cmIn 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.1);
  }
  @keyframes cmIn {
    from { opacity: 0; transform: translateY(26px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .cm-hidden { display: none !important; }

  .cm-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid rgba(201,162,75,0.3);
    padding-bottom: 8px;
    margin-bottom: 10px;
  }
  .cm-actor-name { font-size: 19px; letter-spacing: 0.06em; color: var(--gold-bright); }
  .cm-actor-sub  { font-size: 11px; letter-spacing: 0.14em; color: rgba(233,226,207,0.55); text-transform: uppercase; margin-top: 2px; }
  .cm-ap {
    font-size: 13px; letter-spacing: 0.12em; color: var(--teal);
    border: 1px solid rgba(127,216,207,0.35);
    padding: 4px 12px;
    background: rgba(127,216,207,0.06);
  }

  .cm-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .cm-tab {
    flex: 1;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 7px 0;
    color: rgba(233,226,207,0.55);
    border: 1px solid rgba(201,162,75,0.18);
    background: rgba(201,162,75,0.04);
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
  }
  .cm-tab:hover { color: var(--bone); border-color: rgba(201,162,75,0.5); }
  .cm-tab.active {
    color: var(--gold-bright);
    border-color: rgba(201,162,75,0.8);
    background: rgba(201,162,75,0.14);
    box-shadow: 0 0 18px rgba(201,162,75,0.18), inset 0 0 12px rgba(201,162,75,0.08);
  }
  .cm-tab.dim { opacity: 0.35; pointer-events: none; }

  .cm-body { min-height: 150px; }
  .cm-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    margin-bottom: 5px;
    border: 1px solid transparent;
    border-left: 2px solid transparent;
    cursor: pointer;
    transition: background 0.1s;
  }
  .cm-row:hover { background: rgba(201,162,75,0.07); }
  .cm-row.selected {
    border-left: 2px solid var(--gold-bright);
    background: rgba(201,162,75,0.12);
    box-shadow: inset 0 0 24px rgba(201,162,75,0.06);
  }
  .cm-row.disabled { opacity: 0.4; cursor: default; }
  .cm-row-title { font-size: 15px; letter-spacing: 0.04em; color: var(--bone); }
  .cm-row.selected .cm-row-title { color: var(--gold-bright); }
  .cm-row-right { font-size: 12px; letter-spacing: 0.1em; color: var(--teal); }

  .cm-targets {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    padding-top: 4px;
  }
  .cm-tgt {
    border: 1px solid rgba(201,162,75,0.25);
    background: rgba(20,16,22,0.6);
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .cm-tgt:hover { border-color: rgba(201,162,75,0.6); }
  .cm-tgt.selected {
    border-color: var(--gold-bright);
    background: rgba(124,45,58,0.25);
    box-shadow: 0 0 20px rgba(201,162,75,0.22);
  }
  .cm-tgt-name { font-size: 15px; color: var(--bone); letter-spacing: 0.05em; }
  .cm-tgt.selected .cm-tgt-name { color: var(--gold-bright); }
  .cm-tgt-hp { font-size: 11px; color: rgba(233,226,207,0.55); margin-top: 4px; letter-spacing: 0.08em; }

  .cm-desc {
    min-height: 30px;
    border-top: 1px solid rgba(201,162,75,0.2);
    margin-top: 8px;
    padding-top: 8px;
    font-size: 12.5px;
    line-height: 1.5;
    color: rgba(233,226,207,0.7);
    font-style: italic;
  }
  .cm-foot {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: rgba(233,226,207,0.32);
    text-transform: uppercase;
  }

  /* =========================================================
     Overlays: loadout, wave cards, victory / defeat / error
  ========================================================= */
  .ov {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10,13,19,0.72) 0%, rgba(8,10,14,0.94) 78%);
    animation: ovIn 0.5s ease;
  }
  @keyframes ovIn { from { opacity: 0; } to { opacity: 1; } }
  .ov-card {
    width: min(560px, 92vw);
    text-align: center;
    border: 1px solid rgba(201,162,75,0.55);
    background: linear-gradient(180deg, rgba(15,19,27,0.98), rgba(9,12,17,0.98));
    box-shadow: 0 0 80px rgba(201,162,75,0.10), inset 0 0 80px rgba(0,0,0,0.55);
    padding: 40px 44px 34px;
    position: relative;
  }
  .ov-card::before, .ov-card::after {
    content: '';
    position: absolute;
    width: 26px; height: 26px;
    border: 1px solid rgba(232,201,121,0.7);
  }
  .ov-card::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
  .ov-card::after  { bottom: 6px; right: 6px; border-left: none; border-top: none; }

  .ov-title {
    font-size: 30px;
    letter-spacing: 0.16em;
    color: var(--gold-bright);
    text-shadow: 0 0 24px rgba(232,201,121,0.35);
  }
  .ov-sub {
    margin-top: 12px;
    font-size: 13.5px;
    line-height: 1.6;
    color: rgba(233,226,207,0.72);
    font-style: italic;
  }
  .ov-seed { margin-top: 14px; font-size: 10.5px; letter-spacing: 0.14em; color: rgba(233,226,207,0.35); text-transform: uppercase; }
  .ov-btn {
    margin-top: 26px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    border: none;
    padding: 12px 38px;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(201,162,75,0.3);
    transition: all 0.15s;
  }
  .ov-btn:hover { filter: brightness(1.12); box-shadow: 0 0 38px rgba(232,201,121,0.5); }
  .ov-btn:active { transform: translateY(1px); }

  /* --- Pictos (loadout) --- */
  .pictos {
    display: flex;
    gap: 12px;
    margin-top: 26px;
  }
  .picto {
    flex: 1;
    border: 1px solid rgba(201,162,75,0.28);
    background: rgba(18,22,30,0.7);
    padding: 14px 10px 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .picto:hover { border-color: rgba(201,162,75,0.6); transform: translateY(-2px); }
  .picto.on {
    border-color: var(--gold-bright);
    background: rgba(201,162,75,0.12);
    box-shadow: 0 0 26px rgba(201,162,75,0.25), inset 0 0 18px rgba(201,162,75,0.08);
  }
  .picto-glyph { font-size: 26px; line-height: 1; margin-bottom: 10px; }
  .picto-name { font-size: 13px; letter-spacing: 0.08em; color: var(--bone); }
  .picto.on .picto-name { color: var(--gold-bright); }
  .picto-desc { font-size: 11px; line-height: 1.5; color: rgba(233,226,207,0.55); margin-top: 7px; min-height: 48px; }
  .picto-state {
    margin-top: 9px;
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(233,226,207,0.35);
  }
  .picto.on .picto-state { color: var(--teal); }

  .ov-error .ov-title { color: #ff8a6a; }

  /* --- Ending choice (two buttons side by side) --- */
  .ov-choice .ov-card, .ov-ending .ov-card { width: min(720px, 94vw); }
  .choice-row { display: flex; gap: 18px; margin-top: 26px; }
  .choice-btn {
    flex: 1; margin-top: 0; padding: 18px 16px;
    display: flex; flex-direction: column; gap: 9px; align-items: center;
    line-height: 1.4; text-transform: none; letter-spacing: 0.04em; font-size: 15px;
  }
  .choice-btn b { font-size: 16px; letter-spacing: 0.08em; }
  .choice-btn span { font-size: 11.5px; font-style: italic; color: rgba(40,36,26,0.72); }
  .ov-ending .ov-sub { max-width: 520px; margin-left: auto; margin-right: auto; }

  /* --- Tiny helper for the in-battle hint bar --- */
  #hintbar {
    position: fixed;
    left: 0; right: 0; bottom: 6px;
    z-index: 5;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }
  #hintbar span {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(233,226,207,0.28);
  }
</style>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="scene"></div>
  <canvas id="fx"></canvas>
  <canvas id="hud"></canvas>
  <div id="ui"></div>
  <div id="hintbar"><span>Space / J / LMB — PARRY&nbsp;&nbsp;·&nbsp;&nbsp;Shift / L / RMB — DODGE&nbsp;&nbsp;·&nbsp;&nbsp;Tab — menu tabs</span></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
